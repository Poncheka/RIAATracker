name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    env:
      # Public values only. The Mogul client secret lives in Supabase, never here.
      VITE_SUPABASE_URL: https://ofbljjhdxowzcqwnudje.supabase.co
      VITE_MOGUL_CLIENT_ID: mcci_Ev-ROh5IYIrPUMrUB2r7sWcf
      VITE_MOGUL_EMBED_ORIGIN: https://embed.usemogul.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit && npx vite build --base ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
